<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station Watch — AWS Sensor Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #10192B;
    --panel: #182338;
    --panel-border: #26344F;
    --text-primary: #F2F5FA;
    --text-secondary: #AEB9CC;
    --amber: #E8A33D;
    --teal: #3FA796;
    --amber-glow: rgba(232, 163, 61, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    padding: 32px 24px 64px;
  }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 4px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 0 0 var(--teal);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63, 167, 150, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(63, 167, 150, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63, 167, 150, 0); }
  }

  .layout {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 20px;
  }

  .panel-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .feed-item {
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(6px);
    animation: reveal 0.4s ease forwards;
  }

  .feed-item.anomaly {
    border-color: rgba(232, 163, 61, 0.4);
    background: var(--amber-glow);
  }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .feed-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .readings {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    gap: 16px;
  }

  .status-tag {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 3px;
  }

  .status-tag.normal {
    background: rgba(63, 167, 150, 0.15);
    color: var(--teal);
  }

  .status-tag.anomaly {
    background: rgba(232, 163, 61, 0.2);
    color: var(--amber);
  }

  .confidence-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 6px;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .bar-fill.normal { background: var(--teal); }
  .bar-fill.anomaly { background: var(--amber); }

  .conf-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    width: 40px;
    text-align: right;
  }

  .driver {
    font-size: 12px;
    color: var(--amber);
    margin-top: 8px;
  }

  .summary-stat {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13px;
  }

  .summary-stat:last-child { border-bottom: none; }

  .summary-stat .value {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-primary);
  }

  .test-form {
    margin-top: 20px;
  }

  .test-form input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    margin-bottom: 8px;
  }

  .test-form label {
    font-size: 11px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }

  .test-form button {
    width: 100%;
    background: var(--teal);
    color: var(--bg);
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }

  .test-form button:hover { opacity: 0.9; }

  .empty-note {
    color: var(--text-secondary);
    font-size: 13px;
  }

  .conn-error {
    color: var(--amber);
    font-size: 13px;
    line-height: 1.6;
  }

  .conn-error code {
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Station Watch</h1>
      <div class="subtitle">AWS sensor anomaly monitor — live telemetry feed</div>
    </div>
    <div class="status-pill"><span class="dot"></span> Connected to detection service</div>
  </header>

  <div class="layout">
    <div class="panel">
      <div class="panel-title">Incoming readings</div>
      <div id="feed"></div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-title">Session summary</div>
        <div class="summary-stat"><span>Readings processed</span><span class="value" id="stat-total">0</span></div>
        <div class="summary-stat"><span>Anomalies flagged</span><span class="value" id="stat-anomalies">0</span></div>
        <div class="summary-stat"><span>Detection model</span><span class="value">Isolation Forest</span></div>
        <div class="summary-stat"><span>Explainability</span><span class="value">SHAP</span></div>
      </div>

      <div class="panel test-form">
        <div class="panel-title">Test a custom reading</div>
        <label>Temperature (°C)</label>
        <input type="number" id="in-temp" value="24.5" step="0.1">
        <label>Pressure (hPa)</label>
        <input type="number" id="in-pressure" value="1012" step="0.1">
        <label>Humidity (%)</label>
        <input type="number" id="in-humidity" value="58" step="0.1">
        <button onclick="testCustomReading()">Analyze reading</button>
      </div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const API_BASE =
    params.get("api") ||
    (window.location.protocol === "file:" ||
     (window.location.hostname === "localhost" && window.location.port !== "8000") ||
     (window.location.hostname === "127.0.0.1" && window.location.port !== "8000")
      ? "http://127.0.0.1:8000"
      : window.location.origin);
  let total = 0;
  let anomalies = 0;

  function updateStats() {
    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-anomalies").textContent = anomalies;
  }

  function renderReading(r) {
    total++;
    if (r.status === "anomaly") anomalies++;
    updateStats();

    const feed = document.getElementById("feed");
    const item = document.createElement("div");
    item.className = "feed-item" + (r.status === "anomaly" ? " anomaly" : "");

    const driverLine = r.status === "anomaly"
      ? `<div class="driver">Main driver: ${r.top_driver} (SHAP contribution ${r.top_driver_contribution})</div>`
      : "";

    item.innerHTML = `
      <div class="feed-row">
        <div class="readings">
          <span>temp ${r.temperature.toFixed(1)}°C</span>
          <span>pressure ${r.pressure.toFixed(1)} hPa</span>
          <span>humidity ${r.humidity.toFixed(1)}%</span>
        </div>
        <span class="status-tag ${r.status}">${r.status.toUpperCase()}</span>
      </div>
      <div class="confidence-row">
        <div class="bar-track"><div class="bar-fill ${r.status}" style="width:${r.confidence}%"></div></div>
        <div class="conf-label">${r.confidence}%</div>
      </div>
      ${driverLine}
    `;
    feed.prepend(item);
  }

  async function loadStream() {
    try {
      const res = await fetch(`${API_BASE}/stream`);
      const data = await res.json();
      for (const reading of data.readings) {
        renderReading(reading);
        await new Promise(resolve => setTimeout(resolve, 900));
      }
    } catch (err) {
      document.getElementById("feed").innerHTML = `
        <div class="conn-error">
          Couldn't reach the detection service at <code>${API_BASE}</code>.<br><br>
          Make sure the backend is running:<br>
          <code>py -3.11 -m uvicorn backend_api:app --reload</code><br><br>
          Then reload this page.
        </div>`;
    }
  }

  async function testCustomReading() {
    const temperature = parseFloat(document.getElementById("in-temp").value);
    const pressure = parseFloat(document.getElementById("in-pressure").value);
    const humidity = parseFloat(document.getElementById("in-humidity").value);

    try {
      const res = await fetch(`${API_BASE}/predict`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ temperature, pressure, humidity })
      });
      const data = await res.json();
      renderReading(data);
    } catch (err) {
      alert("Couldn't reach the detection service — make sure backend_api.py is running.");
    }
  }

  loadStream();
</script>
</body>
</html>
